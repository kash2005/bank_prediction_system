version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 564599437233.dkr.ecr.eu-north-1.amazonaws.com
  build:
    commands:
      - docker build -t bank_prediction_system .
      - docker tag bank_prediction_system:latest 564599437233.dkr.ecr.eu-north-1.amazonaws.com/bank_prediction_system:latest
  post_build:
    commands:
      - docker push 564599437233.dkr.ecr.eu-north-1.amazonaws.com/bank_prediction_system:latest
      - echo Writing image definitions file...
      - printf '[{"name":"bank_prediction_system","imageUri":"%s"}]' 564599437233.dkr.ecr.eu-north-1.amazonaws.com/bank_prediction_system:latest > imagedefinitions.json   
artifacts:
  files: 
  - imagedefinitions.json